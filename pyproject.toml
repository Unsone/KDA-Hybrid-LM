[project]
name = "kda-hybrid-lm"
version = "0.1.0"
description = "DeltaNet, Gated DeltaNet, KDA and small hybrid language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5,<3",
    "numpy>=2.1,<3",
    "einops>=0.8,<1",
    "PyYAML>=6,<7",
    "tqdm>=4.67,<5",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
training = ["tokenizers>=0.20,<0.23"]
dev = ["pytest>=8,<10", "ipykernel>=6,<8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
